# Dijkstra follow-up kept by hand: dismissed tools, and the issues and PRs that
# bear on a tool's state. Shown on /map/dijkstra and on each tool's page.
#
# Key every entry by the tool's catalog id (the last part of its
# /map/readiness/<id> URL). An unknown id fails the build.
#
#   dismissed:            optional. The tool shows as "Dismissed" instead of its
#     reason: <text>      computed state (which is still shown, smaller).
#     date: YYYY-MM-DD    Any reason: abandoned, too little use to matter, etc.
#   unreleased:           optional. Shows a green dot next to the tool: Dijkstra
#     note: <text>        work is done or nearly done (a branch, an open or
#     date: YYYY-MM-DD    merged PR, a release candidate) but tools downstream
#                         cannot use it yet (unreleased, prerelease only, or in
#                         a fork). Only for work that covers the tool's known
#                         Dijkstra gaps, give or take a small remainder named
#                         in the note; not for one fix among several open gaps.
#                         Remove it once a stable release has the work.
#   links:                optional. Issues, PRs or any other https URL.
#     - url: <url>
#       note: <text>      optional, shown next to the link
#
# A bare string works for any of them: `dismissed: Archived in 2024`,
# `unreleased: Release candidate v2.0.0-rc.1` or
# `- https://github.com/owner/repo/issues/1`.
#
# GitHub titles and open/merged/closed state are not written here. Refresh them
# with `npm run readiness -- sync-tracking`, which writes tracking-state.json.
#
# Work in a fork counts only once it is upstream. A PR merged in a fork shows as
# "merged in fork, not upstream". To follow a fork branch, link the GitHub
# compare view against upstream:
#   https://github.com/<upstream>/compare/<branch>...<owner>:<repo>:<branch>
# The sync records how many fork commits are not upstream yet and the fork's
# latest commit; the link reads as merged once none are left.
#
# Example:
#   tools:
#     nami:
#       dismissed:
#         reason: Wallet is archived; users were moved to Lace.
#         date: 2026-10-22
#     ogmios:
#       links:
#         - url: https://github.com/CardanoSolutions/ogmios/issues/123
#           note: Dijkstra support

