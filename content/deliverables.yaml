- id: D3
  slug: cardano-init
  title: Setup CLI/TUI
  quarter: Q3-2026
  status: in-progress
  statusUpdatedAt: 2026-07-06
  updates:
    - date: "2026-06-12"
      description: First Aiken + MeshJS templates scaffold a buildable project end to end.
      week: "2026-W24"
    - date: "2026-06-23"
      description: Nix installer landed and the full roadmap went public (20+ tracked issues).
      week: "2026-W26"
    - date: "2026-07-10"
      description: Automated release pipeline wired up (cargo dist + npm).
      week: "2026-W28"
    - date: "2026-08-23"
      description: First releases shipped — v0.2.0 and v0.2.1 — with categorized release notes generated from Conventional Commits. The CLI is now the only surface (the web builder was dropped), projects can be edited after generation with `add`/`remove`, and the first external contributions landed (a Dingo devnet provider plus Yaci fixes).
      week: "2026-W34"
  summary: >-
    A "create-react-app" for Cardano: pick a stack, get a project set up and
    ready to build in minutes, with AI/LLM-native commands and a plugin system.
  description: >-
    A high-level umbrella CLI that leverages identified tooling so that starting
    a new Cardano project takes minutes. The initial version ships with a
    reduced stack but a plugin architecture so anyone can add their tooling
    without knowing the tool's internals. Everything that can be upstreamed will
    be upstreamed to improve the underlying tools.
  milestones:
    - id: DX.02
      title: Specifications + POC
      dueDate: "2026-08-31"
      status: in-progress
      description: A clear plan on how we'll implement this tool with a POC.
      evidence: >-
        Repository with defined scope, specs, architecture, and plugin/project
        integration strategy, and POC.
      acceptanceCriteria: "Project plan socialised in public forum / open repository"
      team: "Internal"
      thirdPartyAssurance: "BlinkLabs"
    - id: DX.05
      title: RC ready
      dueDate: "2026-11-30"
      status: not-started
      description: >-
        First Release Candidate for the tool, with the website and docs, has
        been published. Users can already use this tool to create new Cardano
        projects with reduced tech stack options.
      evidence: |-
        1. Repository with beta implementation deemed good enough to be a RC.
        2. Website and documentation.
      acceptanceCriteria: |-
        1.a CLI works with reduced stack options already implemented but ready to be expanded, and expected but non-critical bugs.
        2.a Documentation and website are publicly accessible.
      team: ""
      thirdPartyAssurance: "BlinkLabs"
  links: []

